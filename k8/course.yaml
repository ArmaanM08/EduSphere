apiVersion: apps/v1
kind: Deployment
metadata:
  name: course-service

spec:
  replicas: 2

  selector:
    matchLabels:
      app: course-service

  template:
    metadata:
      labels:
        app: course-service

    spec:
      containers:
      - name: course-service
        image: course-service:latest
        imagePullPolicy: Never

        ports:
        - containerPort: 5001

---
apiVersion: v1
kind: Service
metadata:
  name: course-service

spec:
  selector:
    app: course-service

  ports:
  - port: 5001
    targetPort: 5001

  type: ClusterIP

