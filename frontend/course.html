<!DOCTYPE html>
<html>

<head>
    <title>EduSphere Course</title>

    <style>

        body{
            font-family: Arial, sans-serif;
            background:#f4f7fc;
            margin:0;
            padding:0;
        }

        .container{
            max-width:1000px;
            margin:auto;
            padding:40px;
        }

        .header{
            background:white;
            padding:30px;
            border-radius:12px;
            margin-bottom:20px;
            box-shadow:0 4px 10px rgba(0,0,0,0.1);
        }

        .cards{
            display:grid;
            grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
            gap:20px;
        }

        .card{
            background:white;
            padding:20px;
            border-radius:10px;
            box-shadow:0 4px 10px rgba(0,0,0,0.1);
        }

        ul{
            background:white;
            padding:20px 40px;
            border-radius:10px;
            box-shadow:0 4px 10px rgba(0,0,0,0.1);
        }

        li{
            margin:10px 0;
        }

    </style>
</head>

<body>

<div class="container">

    <div class="header">

        <h1 id="title"></h1>

        <p id="description"></p>

    </div>

    <div class="cards">

        <div class="card">
            <h3>Difficulty</h3>
            <p id="difficulty"></p>
        </div>

        <div class="card">
            <h3>Pricing</h3>
            <p id="pricing"></p>
        </div>

        <div class="card">
            <h3>Duration</h3>
            <p id="duration"></p>
        </div>

        <div class="card">
            <h3>Enrolled</h3>
            <p id="enrolled"></p>
        </div>

    </div>

    <br>

    <h2>Topics Covered</h2>

    <ul id="topics"></ul>

</div>

<script src="course.js"></script>

</body>
</html>
