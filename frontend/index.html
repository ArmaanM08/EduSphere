<!DOCTYPE html>
<html>
<head>
    <title>EduSphere</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, sans-serif;
        }

        body{
            background:#f4f7fc;
            color:#333;
        }

        .navbar{
            background:#1e3a8a;
            color:white;
            padding:20px 50px;
            display:flex;
            justify-content:space-between;
            align-items:center;
        }

        .navbar h2{
            font-size:28px;
        }

        .hero{
            text-align:center;
            padding:80px 20px;
        }

        .hero h1{
            font-size:50px;
            color:#1e3a8a;
            margin-bottom:20px;
        }

        .hero p{
            font-size:20px;
            color:#555;
            margin-bottom:30px;
        }

        button{
            padding:15px 30px;
            border:none;
            background:#2563eb;
            color:white;
            border-radius:8px;
            cursor:pointer;
            font-size:18px;
            transition:0.3s;
        }

        button:hover{
            background:#1d4ed8;
        }

        .courses{
            padding:50px;
            text-align:center;
        }

        .courses h2{
            color:#1e3a8a;
            margin-bottom:30px;
        }

        #courseList{
            display:grid;
            grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
            gap:20px;
            list-style:none;
        }

        #courseList li{
            background:white;
            padding:25px;
            border-radius:12px;
            box-shadow:0 4px 10px rgba(0,0,0,0.1);
            font-size:18px;
            font-weight:bold;
            transition:0.3s;
        }

        #courseList li:hover{
            transform:translateY(-5px);
        }

        .footer{
            text-align:center;
            padding:20px;
            background:#1e3a8a;
            color:white;
            margin-top:50px;
        }
    </style>
</head>

<body>

    <div class="navbar">
        <h1>EduSphere V1</h1>
        <p>DevOps Learning Platform</p>
    </div>

    <div class="hero">
        <h1>Welcome to EduSphere</h1>

        <p>
            Learn AWS, Docker, Kubernetes, Jenkins and Modern DevOps
            Technologies Through Interactive Courses.
        </p>

        <button onclick="loadCourses()">
            Explore Courses
        </button>
    </div>

    <div class="courses">
        <h2>Available Courses</h2>

        <ul id="courseList"></ul>
    </div>

    <div class="footer">
        EduSphere © 2026 | DevOps Project
    </div>

    <script src="app.js"></script>

</body>
</html>
